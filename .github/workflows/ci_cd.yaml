# Yet Another Markup Language

name: CI

on:
  push:
    branches:
      - main
      - any-feature-branch

jobs:

  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CI_session/artefacts/requirements.txt

      - name: Run tests
        working-directory: CI_session
        run: |
          python -m pytest

  job2:
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CI_session
          file: ./CI_session/Dockerfile
          push: true
          tags: apoorvaa15/ci_demo:latest
